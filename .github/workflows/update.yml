name: Update Profile

on:
  schedule:
    - cron: "0 * * * *"   # Auto-update setiap jam
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: myzert
        run: python update_profile.py
      - name: Commit & Push
        run: |
          git config user.name "myzert"
          git config user.email "zerttcihuy@gmail.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: auto-update profile $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
